services:
  newsnow:
    # 从本仓库构建：原来这里拉的是上游镜像 ghcr.io/ourongxing/newsnow，跑起来是别人家的代码，
    # 不含本仓库的改动。要换成自己发布的镜像就改这里的 image。
    build: .
    image: newsnow-yi:local
    container_name: newsnow
    ports:
      - '127.0.0.1:4444:4444'
    volumes:
      - newsnow_data:/usr/app/.data
    environment:
      - HOST=0.0.0.0
      - PORT=4444
      - NODE_ENV=production
      - G_CLIENT_ID=
      - G_CLIENT_SECRET=
      - JWT_SECRET=${JWT_SECRET:-}
      - INIT_TABLE=true
      - ENABLE_CACHE=true
      - PRODUCTHUNT_API_TOKEN=

volumes:
  newsnow_data:
    name: newsnow_data
