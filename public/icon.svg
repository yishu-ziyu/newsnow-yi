<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="闻见">
  <title>闻见</title>
  <!-- 信号点阵：九个位置里八个是低权重信息，只有一个被识别为值得追踪的信号 -->
  <rect width="512" height="512" rx="56" fill="#F9F7F1" />
  <g fill="#20201D">
    <!-- 第一行：··■ -->
    <circle cx="128" cy="128" r="31" />
    <circle cx="256" cy="128" r="26" />
    <rect x="361" y="105" width="46" height="46" />
    <!-- 第二行：·●（● 是信号，红色，见下） -->
    <circle cx="128" cy="256" r="26" />
    <circle cx="384" cy="256" r="31" />
    <!-- 第三行：■·· -->
    <rect x="105" y="361" width="46" height="46" />
    <circle cx="256" cy="384" r="31" />
    <circle cx="384" cy="384" r="26" />
  </g>
  <circle cx="256" cy="256" r="58" fill="#F14D42" />
</svg>
