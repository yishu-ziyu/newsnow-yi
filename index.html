<!doctype html>
<html lang="zh-CN">

<head>
  <script>
    try {
      const colorScheme = JSON.parse(localStorage.getItem("color-scheme"))
      const isDark = colorScheme === "dark"
        || (colorScheme === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches)
      document.documentElement.classList.toggle("dark", isDark)
    } catch {
      document.documentElement.classList.remove("dark")
    }
  </script>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/icon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- 统计：上游那段 Google Analytics 已移除——它是上游作者的媒体资源，留着等于把访客数据
       交给别人的账号（具体 ID 见 git 历史）。要用就换成自己的 ID，或换 Umami/Plausible 这类自托管方案。
  -->

  <script>
    const query = new URLSearchParams(window.location.search)
    if (query.has("login") && query.has("user") && query.has("jwt")) {
      localStorage.setItem("user", query.get("user"))
      localStorage.setItem("jwt", JSON.stringify(query.get("jwt")))
      window.history.replaceState({}, document.title, window.location.pathname)
    }
  </script>
  <title>闻见</title>

<body>
